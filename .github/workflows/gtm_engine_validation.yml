name: GTM Engine Data & Code Validation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-gtm-engine:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest flake8

    - name: Run Flake8 Linter & Core Execution Check
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        python scripts/data_hygiene/canonicalize_accounts.py
        python integrations/gong/gong_trigger_handler.py
        python orchestration/gtm_pipeline_dag.py

    - name: Run Pytest Test Suite
      run: |
        pytest tests/ -v

    - name: Validate dbt Model Syntax & Schema Assertions
      run: |
        python -c "import yaml; yaml.safe_load(open('dbt/models/marts/gtm/schema.yml'))"
        echo "dbt schema assertions and SQL models verified successfully."
